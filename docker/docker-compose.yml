services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_olist
    restart: always
    # ports:
    #   - "27017:27017"
    env_file:
      - ../.env.docker
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - olist_net

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: olist_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ../.env.docker
    volumes:
      - ../data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - olist_net

volumes:
  mongo_data:
    driver: local

networks:
  olist_net:
    driver: bridge