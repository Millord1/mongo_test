services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_olist
    restart: unless-stopped

    env_file:
      - ../.env

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - olist_net

  ingest:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    env_file:
      - ../.env

    command: ["python", "-m", "src.ingestion.mongo_ingester"]

    volumes:
      - ../data:/app/data

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - olist_net

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: olist_app
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - ../.env

    volumes:
      - ../data:/app/data

    depends_on:
      mongodb:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully

    networks:
      - olist_net


volumes:
  mongo_data:


networks:
  olist_net: