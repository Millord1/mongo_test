[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-mongodb-fastapi"
version = "1.0.0"
description = "API FastAPI et base MongoDB pour l'exploitation du dataset e-commerce Olist"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "python-dotenv>=1.0.1",
    "pymongo>=4.6.0,<5.0.0",
    "kagglehub==1.0.2",
    "duckdb==0.10.0",
    "pydantic==2.6.4",
    "fastapi==0.110.0",
    "uvicorn==0.28.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.27.2",
    "ruff==0.6.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

exclude = [
    ".git",
    ".venv",
    "env",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = []

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
combine-as-imports = false